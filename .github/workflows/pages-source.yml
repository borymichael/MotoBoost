# Workflow ponctuel : bascule la source de GitHub Pages sur « GitHub Actions » (au lieu de « branche »),
# afin que l'ancienne publication Jekyll n'écrase plus le site construit par pages.yml.
# Il se lance une fois, à son ajout au dépôt (ou à la demande), puis peut être supprimé.
name: Régler la source GitHub Pages (ponctuel)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pages-source.yml'

permissions:
  contents: read
  pages: write

jobs:
  set-source:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API: https://api.github.com/repos/${{ github.repository }}/pages
    steps:
      - name: Configuration actuelle de Pages
        run: |
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API" | tee before.json
          echo

      - name: Passer la source sur GitHub Actions
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API" -d '{"build_type":"workflow"}')
          echo "HTTP $code"
          cat response.json
          test "$code" = "204"

      - name: Configuration après changement
        run: |
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$API"
          echo
